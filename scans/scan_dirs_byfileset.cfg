[ ${#srcdirs[@]} -eq ${#projnames[@]} ] || { echo "ERROR: array size mismatch!!"; exit 1; }

# Filesets that took 2-5 hours on one node (deployed walkstat, October 2026) get a multi-node
# job array of their own (submit_scan_array.sh): SCAN_SET=large selects them, anything else
# selects the rest. See docs/phase3.5-results.md.
large_projnames=" CGD-cas CGD-tss MMM-parc NCAR-USGS_Water RAL-hap UWYO-wyom0169 "
want=main; [ "${SCAN_SET:-}" = large ] && want=large
all_groups=("${groups[@]}"); all_filesets=("${filesets[@]}")
all_projnames=("${projnames[@]}"); all_srcdirs=("${srcdirs[@]}")
groups=(); filesets=(); projnames=(); srcdirs=()
for i in "${!all_projnames[@]}"; do
    case "${large_projnames}" in *" ${all_projnames[i]} "*) in_set=large ;; *) in_set=main ;; esac
    [ "${in_set}" = "${want}" ] || continue
    groups+=("${all_groups[i]}"); filesets+=("${all_filesets[i]}")
    projnames+=("${all_projnames[i]}"); srcdirs+=("${all_srcdirs[i]}")
done
unset want in_set i all_groups all_filesets all_projnames all_srcdirs

n_dirs_to_scan=${#srcdirs[@]}
