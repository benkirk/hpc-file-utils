# cgd_migration directory pairs
#
# "key: value" lines, '#' comments.
#
# Global settings (before the first [section]) apply to every job - all members
# of a job array share the same resources.  Environment variables of the same
# name override these, e.g. 'nodes=1 ./submit_sync_array.sh <pair>'.
#
#   queue:     PBS queue
#   walltime:  per-job walltime (main queue limit is 12h)
#   nodes:     nodes per job (all but one node are released after dsync)
#   chunk:     per-node PBS resources; dfind/dsync run 'mpiprocs' ranks per node
#   maxconcur: max concurrently running array members
#   fresh_after: done stamps (stamps/<pair>.done) only count if their pass started
#              after this ('date -d' string); also settable per submission, e.g.
#              'fresh_after=now make run' re-syncs everything once
#
# Tunables - may also be set per pair, which takes precedence:
#   batch_files:   dsync --batch-files [250000]; file metadata is set per batch, so a
#                  batch is the work lost on restart - keep one batch << walltime
#                  (e.g. 25000 for trees of ~1 GiB files)
#   msrsync:       auto|yes|no [auto = hsm and chmod pairs only]; after a completed dsync msrsync
#                  only re-crawls the tree. hard links are restored by the final
#                  serial rsync -H either way (dsync and msrsync both break them).
#   msrsync_procs: msrsync rsync processes [nproc on the remaining node]
#   max_delete:    cap on what the final rsync --delete may remove, N or N% of the
#                  source items [1%, at least 1000]; over the cap rsync exits 25, no stamp
#   verify_sample: files compared byte-for-byte with the source before stamping [200]
#   chmod:         rsync --chmod for every rsync pass, e.g. 'Du+w' for a read-only source
#                  (dsync would create read-only dirs it can't fill): skips dsync, msrsync
#                  (auto) does the bulk copy. The dest keeps the changed modes.
#   copier:        dsync|walksync [dsync]; walksync (derecho only) does the bulk copy on all
#                  nodes instead of dsync and msrsync, for any pair: read-only sources (it
#                  always copies with --chmod=Du+w; chmod may only be Du+w) and hsm pairs
#                  (--exclude 'COLD_STORAGE*'). The final serial rsync --delete stays.
#   walksync_opts: more walksync options, split on blanks, no quotes [--rsyncs 8]
#   walksync_bind: mpiexec CPU binding for walksync [--cpu-bind depth --depth 4]
#   hfu_root:      the hpc-file-utils install walksync comes from
#                  [/glade/u/apps/opt/hpc-file-utils/current-derecho]
#   walksync_inplace: auto|yes|no [auto]; rsync --inplace for walksync's copies (no temp file
#                  and rename per file); auto = only when dest is empty at job start
#
# Safety: src and dest must be absolute, normalized, different, not nested, and under
#   allowed_roots: space-separated global [/glade/campaign/]
#
# A '<host>.key' setting (host from ${NCAR_HOST}, e.g. casper.queue) takes
# precedence on that host, so the same config submits from derecho or casper.

queue:     main
walltime:  12:00:00
nodes:     4
chunk:     ncpus=128:mpiprocs=32:mem=235G
maxconcur: 4

casper.queue: casper
casper.chunk: ncpus=16:mpiprocs=16:mem=160G

# One [section] per pair; the section name labels jobs & logs.
# Section order defines the job array index.
#
#   src:   source directory (required)
#   dest:  destination directory (required)
#   hsm:   yes -> tree contains HSM COLD_STORAGE* dirs: skip dsync, prune them
#          from msrsync/rsync, and symlink them from dest back to src (optional)
#   owner: new user:group for the root hand-off (optional); without it the pair keeps
#          the source's ownership (make root_commands vs. make root_chown_commands)
#   done:  yes -> finished for good, set by hand (e.g. once the dest permissions are
#          changed and we can't write anyway): never submitted, its jobs exit at once,
#          whatever fresh_after says. link/compress/root_commands still accept it [no]

[3A-CESM-HR]
src:   /glade/campaign/collections/cmip/CMIP6/CESM-HR
dest:  /glade/campaign/cesm/community/CESM-HR
hsm:   yes
# no owner: keeps the source's (fredc) ownership via the root rsync hand-off
done:  yes   # handed off 2026-11-03 (root rsync kept fredc ownership; source hidden, 30 COLD_STORAGE links, old path -> symlink)

[3B-cesm-timeseries]
done:  yes   # handed off (root rsync + chown asphilli:cesm, 2026-10-28); sources frozen archives
src:   /glade/campaign/collections/cmip/CMIP6/timeseries-cmip6
dest:  /glade/campaign/cesm/cmip/cmip6/cesm-timeseries
owner: asphilli:cesm
batch_files: 25000   # ~32 TiB/batch (1.6M files, ~1.3 GiB avg, incompressible)

[3C-cmip6-timeseries]
done:  yes   # handed off (root rsync + chown asphilli:cesm, 2026-10-28); sources frozen archives
src:   /glade/campaign/collections/cdg/data/CMIP6
dest:  /glade/campaign/cesm/cmip/cmip6/cmip-timeseries
owner: asphilli:cesm
batch_files: 50000   # ~16 TiB/batch (2.7M files, ~345 MB avg uncompressed)

[3D-cmip5-timeseries]
done:  yes   # handed off (root rsync + chown asphilli:cesm, 2026-10-28); sources frozen archives
src:   /glade/campaign/collections/cdg/data/cmip5
dest:  /glade/campaign/cesm/cmip/cmip5/cmip-timeseries
owner: asphilli:cesm

# round 4: Adam Phillips request 2026-11-05 (sheet rows 2-5, "requires cp (ben first)");
# every pair crosses filesets (CMIP6/cgd_cesm -> cesm_cmip/cesm), so a copy, not a mv.
# sizes from the cs-usage scan; no COLD_STORAGE* per the scan (the dfind preflight checks live)

[4A-cmip6-restarts]
src:   /glade/campaign/collections/cmip/CMIP6/restarts
dest:  /glade/campaign/cesm/cmip/cmip6/restarts
owner: asphilli:cesm
chmod: Du+w          # source read-only since 2026-11-03: dirs must stay writable to fill them

[4B-cmip6-COVID]
src:   /glade/campaign/collections/cmip/CMIP6/COVID
dest:  /glade/campaign/cesm/cvcwg/cvwg/COVID
owner: asphilli:cesm
chmod: Du+w          # source read-only since 2026-11-03 (88.5 TiB, 523K files)
copier: walksync     # C 2026-11-12: dest deleted (job 8163692) and re-copied with walksync (--inplace: auto)

[4C-CESM2-SF]
src:   /glade/campaign/cgd/cesm/CESM2-SF
dest:  /glade/campaign/cesm/cross-wg/CESM2-SF
owner: asphilli:cesm
batch_files: 50000   # ~22 TiB/batch (86.9 TiB, 196K files, ~460 MB avg)
copier: walksync     # B0 2026-11-11: dsync can never stamp 4C (utime() on the root-copied nanr file)

[4D-CESM2-LE]
src:   /glade/campaign/cgd/cesm/CESM2-LE
dest:  /glade/campaign/cesm/cross-wg/CESM2-LE
owner: asphilli:cesm
# default batch_files 250000: ~15 TiB/batch (58.7 TiB, 1.0M files, ~61 MB avg)
copier: walksync     # B 2026-11-11: dest deleted (job 8155365) and re-copied with walksync

# Adam Phillips sheet rows 2 and 4, added 2026-11-11: both cross filesets, so copies.
# (row 3, cross-wg/S2S -> espwg/, stays within fileset cesm: a root mv, not a pair.)

[4E-ARTMIP]
src:   /glade/campaign/collections/cdg/data/ARTMIP
dest:  /glade/campaign/cgd/ccr/shields/ARTMIP_CDG
owner: shields:cgd
chmod: Du+w          # source read-only since 2026-11-03; emptied on/after 2026-12-01 (Part 5)
copier: walksync
# renamed on purpose: shields/ARTMIP already exists. dest parent is shields-only: root creates ARTMIP_CDG for benkirk first

[4F-km-scale]
src:   /glade/campaign/cesm/km-scale
dest:  /glade/campaign/cesm/community/km-scale
# no owner: keeps the source ownership (Keep as is) via the root rsync hand-off
copier: walksync     # 3.0 PiB, 146K entries: one 16-node x 24 h job (11.6 h walksync) + a no-op re-pass
